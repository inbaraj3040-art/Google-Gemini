<!doctype html><html><head><meta name="viewport" content="width=device-width,initial-scale=1"><title>Register - EduGenie</title><link rel="stylesheet" href="/static/style.css"></head><body>
<div class="auth card"><h1>🎓 EduGenie</h1><h2>Create Student Account</h2>{% if error %}<div class="error">{{error}}</div>{% endif %}
<form method="post"><input name="name" placeholder="Full name" required><input name="email" type="email" placeholder="Email" required><input name="password" type="password" placeholder="Password" required><button>Register</button></form><p>Already registered? <a href="/login">Login</a></p></div></body></html>
